# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ AUTOSTART APPLICATIONS                                                    ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ SYSTEM SERVICES                                                           │
# └───────────────────────────────────────────────────────────────────────────┘

# Keyring daemon for WiFi passwords (supports both GNOME and KDE users)
# KDE users: kwallet is used if available
# GNOME/other users: gnome-keyring is used
exec-once = /usr/lib/pam_kwallet_init || gnome-keyring-daemon --start --components=secrets,pkcs11
exec-once = gnome-keyring-daemon --start --components=secrets 2>/dev/null

# Authentication agent (with fallback paths for KDE and GNOME)
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1

# XDG Desktop Portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ UI COMPONENTS                                                             │
# └───────────────────────────────────────────────────────────────────────────┘

# Kill any leftover bars/shells from previous sessions
exec-once = pkill -x waybar 2>/dev/null || true
exec-once = pkill -f "quickshell.*Main.qml" 2>/dev/null || true
exec-once = pkill -f "quickshell.*TopBar.qml" 2>/dev/null || true
exec-once = pkill -f "quickshell.*Floating.qml" 2>/dev/null || true

# Wallpaper daemon
exec-once = awww-daemon
exec-once = sleep 0.5 && awww img "$(find "$WALLPAPER_DIR" -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' -o -name '*.webp' \) | head -n 1)" --transition-type fade --transition-fps 120 --transition-duration 2

# Quickshell QML-based shell — SINGLE ENTRY POINT via Shell.qml
# Shell.qml loads Main.qml + TopBar.qml + Floating.qml internally
exec-once = bash -c 'BIN=""; command -v quickshell >/dev/null 2>&1 && BIN=quickshell || command -v qs >/dev/null 2>&1 && BIN=qs; [ -n "$BIN" ] && exec $BIN -p ~/.config/hypr/scripts/quickshell/Shell.qml || true'

# Focus daemon
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py &

# System init & settings
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = ~/.config/hypr/scripts/qs_manager.sh toggle guide &

# MPRIS player daemon
exec-once = playerctld

# On-screen display
exec-once = swayosd-server --top-margin 0.9 --style "$HOME/.config/swayosd/style.css"

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ UTILITIES                                                                 │
# └───────────────────────────────────────────────────────────────────────────┘

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Network manager applet
exec-once = nm-applet --indicator

# Bluetooth
exec-once = blueman-applet

# Idle management
exec-once = hypridle

# Volume listener
exec-once = ~/.config/hypr/scripts/volume_listener.sh

# Update notifier
exec-once = ~/.config/hypr/scripts/update_notifier.sh

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ CURSOR                                                                    │
# └───────────────────────────────────────────────────────────────────────────┘

exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ GTK THEME                                                                 │
# └───────────────────────────────────────────────────────────────────────────┘

exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
