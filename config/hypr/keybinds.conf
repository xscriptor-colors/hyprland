# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ KEYBINDINGS - Complete Configuration                                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# Main modifier key
$mainMod = SUPER

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ APPLICATIONS                                                              │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, kitty
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, E, exec, nautilus
bind = $mainMod, F, exec, firefox
bind = $mainMod, period, exec, rofi -show emoji -theme ~/.config/rofi/launcher.rasi

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ QUICKSHELL CONTROLS                                                       │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod, Q, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = $mainMod, C, exec, ~/.config/hypr/scripts/qs_manager.sh toggle clipboard
bind = $mainMod, P, exec, ~/.config/hypr/scripts/qs_manager.sh toggle movies
bind = $mainMod, D, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, B, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle battery
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = $mainMod, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = $mainMod, N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle volume
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle guide
bind = $mainMod SHIFT, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = $mainMod SHIFT, T, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle focustime
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/reload.sh

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WINDOW MANAGEMENT                                                         │
# └───────────────────────────────────────────────────────────────────────────┘

bind = ALT, F4, killactive
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, Space, togglefloating,
bind = $mainMod SHIFT, Space, pin,

# Center floating window
bind = $mainMod, G, centerwindow,

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ LOCK / LOGOUT / POWER                                                     │
# └───────────────────────────────────────────────────────────────────────────┘

bindel = $mainMod, L, exec, bash ~/.config/hypr/scripts/lock.sh
bind = $mainMod SHIFT, L, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle battery
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/exit.sh
bind = $mainMod CTRL, L, exec, systemctl suspend
bind = $mainMod CTRL SHIFT, L, exec, systemctl poweroff

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ SCREENSHOTS                                                               │
# └───────────────────────────────────────────────────────────────────────────┘

bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MULTIMEDIA KEYS                                                           │
# └───────────────────────────────────────────────────────────────────────────┘

bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

# Alternative brightness keys (for keyboards without brightness keys)
bindel = $mainMod, F3, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = $mainMod, F2, exec, ~/.config/hypr/scripts/brightness.sh down

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

# Alternative volume keys (for keyboards without multimedia keys)
bind = $mainMod, equal, exec, ~/.config/hypr/scripts/volume.sh up
bind = $mainMod, minus, exec, ~/.config/hypr/scripts/volume.sh down
bind = $mainMod, BackSpace, exec, ~/.config/hypr/scripts/volume.sh mute

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ FOCUS MOVEMENT (Arrow Keys + HJKL)                                        │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Cycle through windows
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WINDOW MOVEMENT                                                           │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WINDOW RESIZE                                                             │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WORKSPACES                                                                │
# └───────────────────────────────────────────────────────────────────────────┘

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/qs_manager.sh 1 move
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/qs_manager.sh 2 move
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/qs_manager.sh 3 move
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/qs_manager.sh 4 move
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/qs_manager.sh 5 move
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/qs_manager.sh 6 move
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7 move
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8 move
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9 move
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10 move

# Navigate workspaces with Page Up/Down
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, Page_Down, workspace, e+1

# Previous workspace (XMonad-style, stays on current monitor)
bind = $mainMod, Tab, focusworkspaceoncurrentmonitor, previous

# Special workspaces (scratchpads)
bind = $mainMod, A, togglespecialworkspace, files
bind = $mainMod SHIFT, A, movetoworkspace, special:files

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MULTI-MONITOR                                                             │
# └───────────────────────────────────────────────────────────────────────────┘

# Move focus between monitors
bind = $mainMod ALT, I, focusmonitor, +1
bind = $mainMod ALT, U, focusmonitor, -1

# Move active window to adjacent monitor
bind = $mainMod ALT SHIFT, I, movewindow, mon:+1
bind = $mainMod ALT SHIFT, U, movewindow, mon:-1

# Swap workspaces between monitors
bind = $mainMod ALT, O, swapactiveworkspaces, 0 1

# Move current workspace to the next monitor
bind = $mainMod ALT, P, movecurrentworkspacetomonitor, +1

# Monitor manager (position, resolution, refresh rate)
bind = $mainMod ALT, M, exec, ~/.config/hypr/scripts/monitor-manager.sh
bind = $mainMod ALT SHIFT, M, exec, ~/.config/hypr/scripts/monitor-manager.sh info

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MOUSE BINDINGS                                                            │
# └───────────────────────────────────────────────────────────────────────────┘

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ THEME & WALLPAPER                                                         │
# └───────────────────────────────────────────────────────────────────────────┘

# bind = $mainMod ALT, T, exec, ~/.config/hypr/scripts/theme-switcher.sh
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/scale-menu.sh

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ COLOR PICKER                                                              │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod SHIFT, C, exec, hyprpicker -a

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ GPU PERFORMANCE MODE (NVIDIA)                                             │
# └───────────────────────────────────────────────────────────────────────────┘

# Cycle GPU performance modes: silent → normal → turbo
bind = $mainMod ALT, G, exec, ~/.config/hypr/scripts/gpu-mode.sh cycle

# Open Rofi GPU mode selector
bind = $mainMod ALT SHIFT, G, exec, ~/.config/hypr/scripts/gpu-mode.sh menu

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ HYPRLAND RELOAD                                                           │
# └───────────────────────────────────────────────────────────────────────────┘

bind = $mainMod SHIFT, R, exec, hyprctl reload
