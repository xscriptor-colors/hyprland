source = ~/.config/hypr/colors.conf

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MODULAR CONFIGURATION                                                     │
# └───────────────────────────────────────────────────────────────────────────┘

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/config/variables.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/config/settings.conf

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MONITOR CONFIGURATION                                                     │
# │                                                                           │
# │ Default: auto-detect all monitors.                                       │
# │ For multi-monitor, uncomment the lines below and adjust.                 │
# │ Run: hyprctl monitors all  →  to identify your monitors.                │
# └───────────────────────────────────────────────────────────────────────────┘

# Auto-detect via generated monitors.conf (see settings_watcher.sh & detect-monitors.sh)
source = ~/.config/hypr/config/monitors.conf

# Fallback if monitors.conf is missing (auto-detects max refresh rate per monitor)
# Run: ~/.config/hypr/scripts/detect-monitors.sh

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ INPUT CONFIGURATION                                                       │
# └───────────────────────────────────────────────────────────────────────────┘

input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    mouse_refocus = false

    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 1.0
    }
}

cursor {
    no_hardware_cursors = true
}

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ GENERAL CONFIGURATION                                                     │
# └───────────────────────────────────────────────────────────────────────────┘

general {
    gaps_in = 16
    gaps_out = 25
    border_size = 0

    layout = dwindle
    resize_on_border = true

    allow_tearing = false
}

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DECORATION                                                                │
# └───────────────────────────────────────────────────────────────────────────┘

decoration {
    rounding = 20

    active_opacity = 0.85
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    # Shadow subcategory
    shadow {
        enabled = true
        range = 35
        render_power = 5
        color = rgba(000000CC)
        color_inactive = rgba(00000088)
        offset = 0 10
    }

    # Blur subcategory
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        special = false
        popups = true
    }
}

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ LAYOUT                                                                    │
# └───────────────────────────────────────────────────────────────────────────┘

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    orientation = left
}

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ GESTURES (New System)                                                     │
# └───────────────────────────────────────────────────────────────────────────┘

# 3-finger horizontal swipe for workspace switching (new gesture syntax)
gesture = 3, horizontal, workspace

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ MISC                                                                      │
# └───────────────────────────────────────────────────────────────────────────┘

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    always_follow_on_dnd = true
    layers_hog_keyboard_focus = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = false
}

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ XWAYLAND                                                                  │
# └───────────────────────────────────────────────────────────────────────────┘

xwayland {
    force_zero_scaling = true
}
